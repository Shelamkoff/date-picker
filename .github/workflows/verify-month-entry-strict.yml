name: Strict month labels and direct entry verification

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/verify-month-entry-strict.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Run strict verification
        id: verify
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            npm ci --no-audit --no-fund
            npm run typecheck
            npm test
            npm pack --dry-run --ignore-scripts
            npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.62.1
            npx playwright install --with-deps chromium
            npm run build
            cp src/style.css style.css
            python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/date-picker-http.log 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' EXIT
            ready=0
            for attempt in {1..30}; do
              if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" != "1" ]; then
              cat /tmp/date-picker-http.log
              exit 1
            fi
            BROWSER=chromium AUDIT_URL=http://127.0.0.1:4173/index.html node tests/pointer-selection.browser.mjs
          ) > /tmp/month-entry-strict.log 2>&1
          status=$?
          cat /tmp/month-entry-strict.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record result and remove verifier
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/verify-month-entry-strict.yml
          rm -f style.css .verification-error.log
          if [ "${{ steps.verify.outputs.status }}" != "0" ]; then
            cp /tmp/month-entry-strict.log .verification-error.log
            message="Record strict month entry verification failure"
          else
            message="Strictly verify month labels and direct wheel entry"
          fi
          git add -A
          git diff --cached --check
          git commit -m "$message"
          git push origin HEAD:master

      - name: Fail when strict verification failed
        if: steps.verify.outputs.status != '0'
        run: exit 1
