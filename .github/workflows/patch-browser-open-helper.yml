name: Harden browser audit open helper

on:
  push:
    branches: [browser-recheck]
    paths:
      - .github/workflows/patch-browser-open-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Make picker opening idempotent
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('tests/browser-audit.mjs')
          text = path.read_text()
          old = '''async function openPicker(id) {
            await page.locator(`#${id} .sdp-datepicker__trigger`).click()
            await page.waitForFunction(id => {
              const popover = document.querySelector(`#${id} .sdp-datepicker__popover`)
              return popover && !popover.hidden
            }, id)
          }
          '''.replace('          ', '')
          new = '''async function openPicker(id) {
            const popover = page.locator(`#${id} .sdp-datepicker__popover`)
            if (await popover.evaluate(node => node.hidden)) {
              await page.locator(`#${id} .sdp-datepicker__trigger`).click()
            }
            await page.waitForFunction(id => {
              const current = document.querySelector(`#${id} .sdp-datepicker__popover`)
              return current && !current.hidden
            }, id)
          }
          '''.replace('          ', '')
          if old not in text:
              raise SystemExit('openPicker target not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/browser-audit.mjs
          git diff --cached --check
          git commit -m "Make browser audit picker opening idempotent"
          git push
