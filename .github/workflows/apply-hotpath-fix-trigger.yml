name: Apply verified controller hot-path correction

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-hotpath-fix-trigger.yml

permissions:
  contents: write

concurrency:
  group: apply-date-picker-controller-hotpath
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Apply corrections
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_between(text: str, start_marker: str, end_marker: str, replacement: str) -> str:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement + text[end:]

          controller = Path('src/core/controller.ts')
          text = controller.read_text()

          helper_methods = '''  #isConfiguredMinute(
            year: number,
            month: number,
            day: number,
            hour: number,
            minute: number,
            options: ResolvedDatePickerOptions,
            bounds: DateBounds,
          ): boolean {
            if (minute % options.minuteStep === 0) return true
            return this.#boundaryMinutes(year, month, day, hour, bounds).includes(minute)
          }

          #candidateMinuteOfDayValues(
            parts: Pick<DateParts, 'year' | 'month' | 'day'>,
            options: ResolvedDatePickerOptions,
            bounds: DateBounds,
            onlyHour?: number,
          ): number[] {
            const result = new Set<number>()
            const hours = onlyHour === undefined ? integerRange(0, 23) : [onlyHour]
            for (const hour of hours) {
              for (const minute of integerRange(0, 59, options.minuteStep)) {
                result.add(hour * 60 + minute)
              }
              for (const minute of this.#boundaryMinutes(
                parts.year,
                parts.month,
                parts.day,
                hour,
                bounds,
              )) {
                result.add(hour * 60 + minute)
              }
            }
            return [...result]
          }

          #exactSelectableDate(
            parts: DateParts,
            reference: Date,
            options: ResolvedDatePickerOptions,
            bounds: DateBounds,
            resolveMinute: MinuteResolver,
          ): Date | null {
            if (!this.#isConfiguredMinute(
              parts.year,
              parts.month,
              parts.day,
              parts.hour,
              parts.minute,
              options,
              bounds,
            )) {
              return null
            }
            return nearestCandidate(
              resolveMinute(parts.hour, parts.minute),
              reference.getTime(),
            )
          }

'''
          text = replace_between(
              text,
              '  #selectableMinuteOfDayValues(',
              '  #nearestSelectableDate(',
              helper_methods,
          )

          nearest_method = '''  #nearestSelectableDate(
            parts: DateParts,
            reference: Date,
            options: ResolvedDatePickerOptions,
            bounds: DateBounds,
            onlyHour?: number,
          ): Date | null {
            const resolveMinute = this.#minuteResolver(parts.year, parts.month, parts.day, bounds)
            const requested = parts.hour * 60 + parts.minute
            const values = this.#candidateMinuteOfDayValues(parts, options, bounds, onlyHour)
              .sort((left, right) => {
                const distance = Math.abs(left - requested) - Math.abs(right - requested)
                return distance !== 0 ? distance : left - right
              })

            for (const minuteOfDay of values) {
              const hour = Math.floor(minuteOfDay / 60)
              const minute = minuteOfDay % 60
              const candidate = nearestCandidate(resolveMinute(hour, minute), reference.getTime())
              if (candidate) return candidate
            }
            return null
          }

'''
          text = replace_between(
              text,
              '  #nearestSelectableDate(',
              '  #normalizeSelectableSeed(',
              nearest_method,
          )

          normalize_method = '''  #normalizeSelectableSeed(
            date: Date,
            options: ResolvedDatePickerOptions,
            bounds: DateBounds,
          ): Date {
            const normalized = clampDate(normalizePickerDate(date, options.enableTime), bounds)
            if (!options.enableTime) return normalized

            const parts = dateToParts(normalized)
            const resolveMinute = this.#minuteResolver(parts.year, parts.month, parts.day, bounds)
            const exact = this.#exactSelectableDate(
              parts,
              normalized,
              options,
              bounds,
              resolveMinute,
            )
            if (exact) return exact

            const nearest = this.#nearestSelectableDate(parts, normalized, options, bounds)
            return nearest ?? normalized
          }

'''
          text = replace_between(
              text,
              '  #normalizeSelectableSeed(',
              '  #dateFromParts(',
              normalize_method,
          )

          date_method = text.index('  #dateFromParts(')
          exact_start = text.index('    const requested = new Date(this.#draft.getTime())', date_method)
          nearest_start = text.index('    const nearest = this.#nearestSelectableDate(', exact_start)
          exact_block = '''    const requested = new Date(this.#draft.getTime())
            const exactParts = { ...safeParts }
            const resolveMinute = this.#minuteResolver(
              safeParts.year,
              safeParts.month,
              safeParts.day,
              this.#boundsValue,
            )
            const exact = this.#exactSelectableDate(
              safeParts,
              this.#draft,
              this.#options,
              this.#boundsValue,
              resolveMinute,
            )
            if (exact) return exact

'''
          text = text[:exact_start] + exact_block + text[nearest_start:]
          controller.write_text(text)

          wheel = Path('src/dom/WheelColumn.ts')
          text = wheel.read_text()
          initial_toggle = "    element.classList.toggle('is-looping', this.#loop)\n"
          assert initial_toggle in text
          text = text.replace(initial_toggle, '', 1)
          loop_toggle = "    this.element.classList.toggle('is-looping', loop)\n"
          assert loop_toggle in text
          text = text.replace(loop_toggle, '    this.#syncLoopClass()\n', 1)
          items_assignment = '    this.#items = items\n    this.#value = value\n'
          assert items_assignment in text
          text = text.replace(
              items_assignment,
              '    this.#items = items\n    this.#syncLoopClass()\n    this.#value = value\n',
              1,
          )
          cycle_marker = '  #cycleCount(): number {\n'
          sync_method = '''  #syncLoopClass(): void {
            this.element.classList.toggle('is-looping', this.#loop && this.#items.length > 1)
          }

'''
          assert cycle_marker in text
          text = text.replace(cycle_marker, sync_method + cycle_marker, 1)
          wheel.write_text(text)

          calendar = Path('src/core/calendar.ts')
          text = calendar.read_text()
          start = text.index('function requireRepresentable(')
          end = text.index('export function startOfDay(', start)
          calendar.write_text(text[:start] + text[end:])

          tsconfig = Path('tsconfig.json')
          text = tsconfig.read_text()
          unused_parameters = '    "noUnusedParameters": true,\n'
          assert unused_parameters in text
          if '"noUnusedLocals"' not in text:
              text = text.replace(
                  unused_parameters,
                  '    "noUnusedLocals": true,\n' + unused_parameters,
                  1,
              )
          tsconfig.write_text(text)

          regression = Path('tests/audit-regression.test.mjs')
          text = regression.read_text()
          invalid_test = """test('invalid now callbacks are rejected when read', () => {\n  const controller = new DatePickerController({ now: () => new Date(Number.NaN) })\n  assert.throws(() => controller.open(), /valid Date/)\n})"""
          corrected_test = """test('invalid now callbacks are rejected when read', () => {\n  assert.throws(\n    () => new DatePickerController({ now: () => new Date(Number.NaN) }),\n    /valid Date/,\n  )\n})"""
          assert invalid_test in text
          text = text.replace(invalid_test, corrected_test, 1)
          text = text.replace(
              '\n// Verification trigger: the workflow itself prepares the patched branch before running the matrix.\n',
              '\n',
          )
          Path('tests/controller-regression.test.mjs').write_text(text)
          regression.unlink()

          Path('.gitignore').write_text(dedent('''
            node_modules/
            dist/
            _site/
            *.tgz
            .DS_Store
          ''').lstrip())

          pages = Path('.github/workflows/pages.yml')
          pages.write_text(pages.read_text().replace('actions/setup-node@v4', 'actions/setup-node@v5'))
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Commit verified corrections
        run: |
          rm -f .github/workflows/apply-hotpath-fix.yml
          rm -f .github/workflows/apply-hotpath-fix-trigger.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix controller normalization hot path"
          git push
