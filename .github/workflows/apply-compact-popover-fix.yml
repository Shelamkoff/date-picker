name: Apply compact viewport popover fix

on:
  push:
    branches: [final-library-check]
    paths:
      - .github/workflows/apply-compact-popover-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Apply viewport-aware placement
        run: |
          python3 <<'PY'
          from pathlib import Path

          picker = Path('src/dom/DatePicker.ts')
          text = picker.read_text()
          old_import = "import { WheelColumn, type WheelItem } from './WheelColumn.js'\n"
          new_import = "import { resolvePopoverVerticalPlacement } from './PopoverPlacement.js'\nimport { WheelColumn, type WheelItem } from './WheelColumn.js'\n"
          if old_import not in text:
              raise SystemExit('DatePicker import target not found')
          text = text.replace(old_import, new_import, 1)

          old_position = '''    this.#resetPopoverPosition()
              const anchor = this.element.getBoundingClientRect()
              const popover = this.#popover.getBoundingClientRect()
              const gap = 7
              const spaceBelow = window.innerHeight - anchor.bottom
              const spaceAbove = anchor.top

              if (spaceBelow < popover.height + gap && spaceAbove > spaceBelow) {
                this.#popover.style.top = 'auto'
                this.#popover.style.bottom = 'calc(100% + 0.4rem)'
              }

              const positioned = this.#popover.getBoundingClientRect()
              const viewportPadding = 8
          '''.replace('          ', '')
          new_position = '''    this.#resetPopoverPosition()
              const anchor = this.element.getBoundingClientRect()
              const popover = this.#popover.getBoundingClientRect()
              const gap = 7
              const viewportPadding = 8
              const placement = resolvePopoverVerticalPlacement({
                anchorTop: anchor.top,
                anchorBottom: anchor.bottom,
                popoverHeight: popover.height,
                viewportHeight: window.innerHeight,
                gap,
                viewportPadding,
              })

              if (placement.openAbove) {
                this.#popover.style.top = 'auto'
                this.#popover.style.bottom = 'calc(100% + 0.4rem)'
              }
              this.#popover.style.maxHeight = `${placement.maxHeight}px`

              const positioned = this.#popover.getBoundingClientRect()
          '''.replace('          ', '')
          if old_position not in text:
              raise SystemExit('DatePicker placement target not found')
          text = text.replace(old_position, new_position, 1)

          old_reset = '''    this.#popover.style.removeProperty('top')
              this.#popover.style.removeProperty('bottom')
              this.#popover.style.removeProperty('transform')
          '''.replace('          ', '')
          new_reset = '''    this.#popover.style.removeProperty('top')
              this.#popover.style.removeProperty('bottom')
              this.#popover.style.removeProperty('transform')
              this.#popover.style.removeProperty('max-height')
          '''.replace('          ', '')
          if old_reset not in text:
              raise SystemExit('DatePicker reset target not found')
          picker.write_text(text.replace(old_reset, new_reset, 1))

          styles = Path('src/style.css')
          text = styles.read_text()
          old_style = '''  max-width: min(calc(100vw - 1rem), 36rem);
          overflow: hidden;
          '''.replace('          ', '')
          new_style = '''  max-width: min(calc(100vw - 1rem), 36rem);
          max-height: calc(100vh - 1rem);
          overflow-x: hidden;
          overflow-y: auto;
          '''.replace('          ', '')
          if old_style not in text:
              raise SystemExit('popover CSS target not found')
          styles.write_text(text.replace(old_style, new_style, 1))
          PY
      - name: Verify source fix
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/dom/DatePicker.ts src/style.css
          git diff --cached --check
          git commit -m "Keep popovers inside compact viewports"
          git push
