name: GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify library
        run: npm test

      - name: Build Pages artifact
        run: |
          rm -rf _site
          mkdir -p "_site/dist/${GITHUB_SHA}"
          cp index.html _site/index.html
          cp src/style.css "_site/style-${GITHUB_SHA}.css"
          cp -R dist/. "_site/dist/${GITHUB_SHA}/"
          sed -i "s#\./style\.css#./style-${GITHUB_SHA}.css#g" _site/index.html
          sed -i "s#\./dist/index\.js#./dist/${GITHUB_SHA}/index.js#g" _site/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
