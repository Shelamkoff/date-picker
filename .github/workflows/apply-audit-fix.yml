name: Apply audited date picker fixes

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-audit-fix.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-date-picker-audit-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Apply audited source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .audit/fix.part00 .audit/fix.part01 .audit/fix.part02 .audit/fix.part03 > /tmp/date-picker-audit-fix.b64
          base64 --decode /tmp/date-picker-audit-fix.b64 > /tmp/date-picker-audit-fix.tar.gz
          echo "ad8f1f06328644c18567fb1dd740144d05effc158369658218ec113b030bf46b  /tmp/date-picker-audit-fix.tar.gz" | sha256sum --check
          tar -xzf /tmp/date-picker-audit-fix.tar.gz
          rm -rf .audit
          rm -f .github/workflows/apply-audit-fix.yml

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Commit audited fixes
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Fix audited date picker issues"
          git push origin HEAD:master
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run CI and deploy Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref master
          gh workflow run pages.yml --ref master
          echo "Applied commit: ${{ steps.commit.outputs.sha }}"

# Triggered after all archive parts were staged.
