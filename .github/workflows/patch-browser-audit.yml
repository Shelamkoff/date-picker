name: Patch browser audit sequence

on:
  push:
    branches: [browser-recheck]
    paths:
      - .github/workflows/patch-browser-audit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Reopen the loop picker before its native wheel check
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('tests/browser-audit.mjs')
          text = path.read_text()
          old = "// A looping wheel consumes the wheel gesture rather than moving the page.\nconst loopWheel = page.locator('#audit-loop .sdp-wheel[aria-label=\"Day\"]')\n"
          new = "// A looping wheel consumes the wheel gesture rather than moving the page.\nawait openPicker('audit-loop')\nconst loopWheel = page.locator('#audit-loop .sdp-wheel[aria-label=\"Day\"]')\n"
          if old not in text:
              raise SystemExit('browser audit patch target not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/browser-audit.mjs
          git diff --cached --check
          git commit -m "Fix browser audit picker visibility"
          git push
