name: Clean obsolete branches

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/cleanup-obsolete-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Delete obsolete remote branches
        env:
          BRANCHES: >-
            apply-audit-fix-pr
            browser-recheck
            final-audit-fix
            final-library-check
            fix-pointer-selection
            pages-final-check
            verified-fix-runner
            verify-hotpath-fix
            verify-pointer-pages
        run: |
          for branch in ${BRANCHES}; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              git push origin --delete "${branch}"
            fi
          done

      - name: Remove this one-time workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/cleanup-obsolete-branches.yml
          git add -A
          git commit -m "Remove temporary branch cleanup workflow"
          git push origin HEAD:master
