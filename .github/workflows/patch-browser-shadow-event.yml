name: Fix Shadow DOM browser assertion

on:
  push:
    branches: [browser-recheck]
    paths:
      - .github/workflows/patch-browser-shadow-event.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Account for Shadow DOM event retargeting
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('tests/browser-audit.mjs')
          text = path.read_text()
          old = "  const listener = event => {\n    if (event.target === host) composedEvents += 1\n  }\n"
          new = "  const listener = event => {\n    if (event.composedPath().includes(host)) composedEvents += 1\n  }\n"
          if old not in text:
              raise SystemExit('Shadow DOM listener target not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/browser-audit.mjs
          git diff --cached --check
          git commit -m "Account for Shadow DOM event retargeting"
          git push
