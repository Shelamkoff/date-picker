name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: corepack enable
      - run: corepack prepare pnpm@11.9.0 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @shelamkoff/date-picker typecheck
      - run: pnpm --filter @shelamkoff/date-picker build
      - run: pnpm --filter @shelamkoff/vue-date-picker typecheck
      - run: pnpm --filter @shelamkoff/vue-date-picker build
