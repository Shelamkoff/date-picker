name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0', '22.12.0']
        timezone: [UTC, America/New_York, Australia/Lord_Howe, Pacific/Apia, Europe/Paris]
    runs-on: ubuntu-latest
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate package contents
        run: npm pack --dry-run --ignore-scripts

  pointer-interactions:
    name: Pointer interactions (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BROWSER: chromium
      AUDIT_URL: http://127.0.0.1:4173/index.html
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install library dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned browser test runner
        run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.62.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build library
        run: npm run build

      - name: Start demo server
        run: |
          cp src/style.css style.css
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/date-picker-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/date-picker-http.log
          exit 1

      - name: Test pointer selections and Now action
        run: node tests/pointer-selection.browser.mjs

  apply-month-display:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, 'Run month display implementation')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Apply implementation
        run: python3 scripts/apply_month_display_and_entry.py

      - name: Verify implementation
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm pack --dry-run --ignore-scripts

      - name: Commit implementation and restore CI
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/implement-month-display-and-entry.yml
          rm -f scripts/apply_month_display_and_entry.py
          rmdir scripts 2>/dev/null || true
          git add -A
          git diff --cached --check
          git commit -m "Add configurable month labels and direct wheel entry"
          git push origin HEAD:master
