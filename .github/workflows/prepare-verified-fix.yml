name: Prepare verified date picker fix

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-verified-date-picker-fix
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Apply verified source archive
        run: |
          cat <<'BASE64' | tr -d '\n' | base64 --decode > /tmp/date-picker-fix.tar.gz
          
          BASE64
          tar --extract --gzip --file=/tmp/date-picker-fix.tar.gz --directory=.
          rm -f .github/workflows/apply-hotpath-fix.yml
          rm -f .github/workflows/apply-hotpath-fix-trigger.yml
          rm -f .github/workflows/prepare-verified-fix.yml
          rm -f tests/audit-regression.test.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify all supported timezones
        run: |
          for timezone in UTC America/New_York Australia/Lord_Howe Pacific/Apia Europe/Paris; do
            echo "Testing ${timezone}"
            TZ="${timezone}" node --test tests/*.test.mjs
          done

      - name: Validate package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Commit verified fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Fix controller normalization hot path"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
