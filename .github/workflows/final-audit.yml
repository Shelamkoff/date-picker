name: Final library audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-18:
    name: Node 18 (${{ matrix.timezone }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        timezone: [UTC, America/New_York, Australia/Lord_Howe, Pacific/Apia, Europe/Paris]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '18.20.8'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts

  package-consumer:
    name: Packed-package consumer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run publish lifecycle
        run: npm test
      - name: Create machine-readable tarball report
        run: npm pack --ignore-scripts --json > /tmp/npm-pack.json
      - name: Validate packed file set
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('/tmp/npm-pack.json', 'utf8'))[0]
          if (!report) throw new Error('npm pack did not return a report')
          const paths = new Set(report.files.map(file => file.path))
          for (const required of [
            'package.json',
            'README.md',
            'LICENSE',
            'dist/index.js',
            'dist/index.d.ts',
            'dist/core.js',
            'dist/core.d.ts',
            'src/style.css',
          ]) {
            if (!paths.has(required)) throw new Error(`packed package is missing ${required}`)
          }
          for (const forbidden of ['index.html', '.github/workflows/ci.yml', 'tests/controller.test.mjs']) {
            if (paths.has(forbidden)) throw new Error(`packed package unexpectedly contains ${forbidden}`)
          }
          if (report.unpackedSize > 500_000) {
            throw new Error(`packed package is unexpectedly large: ${report.unpackedSize} bytes`)
          }
          fs.writeFileSync('/tmp/tarball-name', report.filename)
          console.log(JSON.stringify({ filename: report.filename, size: report.size, unpackedSize: report.unpackedSize }, null, 2))
          NODE
      - name: Install tarball into a clean ESM consumer
        run: |
          TARBALL="$(cat /tmp/tarball-name)"
          mkdir -p /tmp/date-picker-consumer
          cd /tmp/date-picker-consumer
          npm init -y >/dev/null
          npm pkg set type=module >/dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL" --ignore-scripts --no-audit --no-fund
          cat > runtime.mjs <<'EOF'
          import { DatePicker, createDatePicker } from '@shelamkoff/date-picker'
          import { createDatePicker as createCorePicker } from '@shelamkoff/date-picker/core'
          import { readFile } from 'node:fs/promises'
          import { createRequire } from 'node:module'

          if (typeof DatePicker !== 'function') throw new Error('DatePicker root export is missing')
          const first = createDatePicker({ enableTime: true, minuteStep: 5 }, new Date(2026, 0, 1, 12, 3))
          const second = createCorePicker({}, new Date(2026, 0, 1))
          if (first.value?.getMinutes() !== 5) throw new Error(`unexpected normalized minute: ${first.value?.getMinutes()}`)
          if (second.value?.getFullYear() !== 2026) throw new Error('core export returned an invalid controller')

          const require = createRequire(import.meta.url)
          const cssPath = require.resolve('@shelamkoff/date-picker/style.css')
          const css = await readFile(cssPath, 'utf8')
          if (!css.includes('.sdp-datepicker')) throw new Error('style export is invalid')
          EOF
          node runtime.mjs
      - name: Compile a strict TypeScript consumer against packed declarations
        run: |
          mkdir -p /tmp/date-picker-consumer/src
          cat > /tmp/date-picker-consumer/tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "NodeNext",
              "moduleResolution": "NodeNext",
              "strict": true,
              "noEmit": true,
              "exactOptionalPropertyTypes": true,
              "noUncheckedIndexedAccess": true,
              "skipLibCheck": false
            },
            "include": ["src/**/*.ts"]
          }
          EOF
          cat > /tmp/date-picker-consumer/src/index.ts <<'EOF'
          import {
            DatePicker,
            createDatePicker,
            type DatePickerWidgetOptions,
            type DatePickerSnapshot,
          } from '@shelamkoff/date-picker'
          import { createDatePicker as createCorePicker } from '@shelamkoff/date-picker/core'
          import '@shelamkoff/date-picker/style.css'

          declare const host: HTMLElement
          const options: DatePickerWidgetOptions = {
            value: null,
            enableTime: true,
            minuteStep: 5,
            onChange(value, reason) {
              value?.getTime()
              reason satisfies 'select' | 'now' | 'clear'
            },
          }
          const widget = new DatePicker(host, options)
          const snapshot: DatePickerSnapshot = widget.snapshot
          createDatePicker().open()
          createCorePicker().open()
          snapshot.parts.year satisfies number
          EOF
          "$GITHUB_WORKSPACE/node_modules/.bin/tsc" -p /tmp/date-picker-consumer/tsconfig.json
      - name: Verify no production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  browsers:
    name: Browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
      AUDIT_URL: http://127.0.0.1:4173/index.html
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test
      - run: npx playwright install --with-deps "${BROWSER}"
      - run: npm run build
      - name: Start local demo
        run: |
          cp src/style.css style.css
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/date-picker-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/date-picker-http.log
          exit 1
      - run: node tests/final-browser-audit.mjs

  live-pages:
    name: Published GitHub Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify current master deployment and immutable assets
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test -n "$EXPECTED_SHA"
          curl --fail --silent --show-error --location https://shelamkoff.github.io/date-picker/ -o /tmp/date-picker-live.html
          grep -F "./dist/${EXPECTED_SHA}/index.js" /tmp/date-picker-live.html
          grep -F "./style-${EXPECTED_SHA}.css" /tmp/date-picker-live.html
          curl --fail --silent --show-error --location "https://shelamkoff.github.io/date-picker/dist/${EXPECTED_SHA}/index.js" -o /tmp/date-picker-index.js
          curl --fail --silent --show-error --location "https://shelamkoff.github.io/date-picker/style-${EXPECTED_SHA}.css" -o /tmp/date-picker-style.css
          grep -F "DatePicker" /tmp/date-picker-index.js
          grep -F ".sdp-datepicker" /tmp/date-picker-style.css
