name: Browser audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    env:
      BROWSER: ${{ matrix.browser }}
      AUDIT_URL: http://127.0.0.1:4173/index.html
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install library dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright temporarily
        run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test

      - name: Install browser
        run: npx playwright install --with-deps "${BROWSER}"

      - name: Build library
        run: npm run build

      - name: Start demo server
        run: |
          cp src/style.css style.css
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/date-picker-http.log 2>&1 &
          echo $! > /tmp/date-picker-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/date-picker-http.log
          exit 1

      - name: Run browser audit
        run: node tests/browser-audit.mjs
