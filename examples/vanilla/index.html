<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Standalone Date Picker</title>
  <link rel="stylesheet" href="../../packages/date-picker/src/style.css">
</head>
<body style="max-width: 28rem; margin: 4rem auto; background: #101213;">
  <div id="picker"></div>
  <script type="module">
    import { DatePicker } from '../../packages/date-picker/dist/index.js'

    new DatePicker(document.querySelector('#picker'), {
      clearable: true,
      showNow: true,
      enableTime: true,
      minuteStep: 5,
      locale: 'en-US',
      ariaLabel: 'Date and time',
    })
  </script>
</body>
</html>
